<div class="page-container">
  <!-- Header Bar -->
  <div class="page-header">
    <div class="header-content">
      <button class="back-button" (click)="goBack()" title="Go back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="header-info">
        <h1 class="page-title">{{ safeName(candidate?.full_name) }}</h1>
      </div>
      <div class="header-actions">
        <button class="action-btn secondary" (click)="downloadResume()" title="View resume">
          📄 Resume
        </button>
        <button class="action-btn secondary" (click)="deleteCandidate()">
          🗑️ Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="loading-container">
    <div class="spinner"></div>
    <p>Loading candidate details...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="!loading && errorMessage" class="error-banner">
    <p>{{ errorMessage }}</p>
  </div>

  <!-- Main Content -->
  <div *ngIf="!loading && candidate" class="content-wrapper">
    
    <!-- Field Groups -->
    <div class="field-groups-container">
      <app-candidate-field-section 
        *ngFor="let group of fieldGroups"
        [section]="group"
        (toggleRequested)="onFieldGroupToggled(group)">
      </app-candidate-field-section>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading && !candidate && !errorMessage" class="empty-state">
    <p>No candidate found</p>
    <button class="back-button" (click)="goBack()">Go Back</button>
  </div>
</div>
