<section class="preview" [attr.aria-labelledby]="'preview-title'">
  <header>
    <div>
      <p class="eyebrow">Step 4 of 5</p>
      <h1 id="preview-title">Preview</h1>
      <p>{{ templateName }}</p>
    </div>
    <div class="actions">
      <button type="button" class="secondary" (click)="changeTemplate()">Change template</button>
      <button type="button" class="primary" (click)="showDownloadOptions()">Download</button>
    </div>
  </header>

  @if (loading()) {
    <p class="status" aria-live="polite">Preparing your resume preview...</p>
  } @else if (error()) {
    <div class="status error" role="alert">
      {{ error() }}
      <button type="button" (click)="loadPreview()">Try again</button>
    </div>
  } @else if (previewHtml()) {
    <article class="document" aria-label="Selected resume document" [innerHTML]="previewHtml()"></article>
  } @else {
    <div class="status" role="alert">
      <p>No preview content available</p>
      <button type="button" (click)="loadPreview()">Reload preview</button>
    </div>
  }

  <footer *ngIf="!loading() && !error()">
    <button type="button" class="docx" (click)="downloadAs('docx')">Download DOCX</button>
    <button type="button" class="pdf" (click)="downloadAs('pdf')">Download PDF</button>
  </footer>

  @if (showDownloadMenu()) {
    <div class="download-modal" (click)="closeDownloadOptions()">
      <div class="download-modal-content" (click)="$event.stopPropagation()">
        <h3>Choose Download Format</h3>
        <button type="button" (click)="downloadAs('docx')">📄 Download DOCX</button>
        <button type="button" (click)="downloadAs('pdf')">📕 Download PDF</button>
        <button type="button" (click)="downloadAs('html')">🌐 Download HTML</button>
      </div>
    </div>
  }
</section>
